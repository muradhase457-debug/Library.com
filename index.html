<style>
/* RFL Catalog v2.25 — premium clay UI (day + night) */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* ---------- Tokens ---------- */
:root{
  --brand:#7c6cf0; --brand-50:#ece8ff; --brand-700:#5b4ad6;
  --ink:#26233d; --muted:#7a7694; --navy:#7c6cf0;
  --bg:#efeefb; --surface:#fff; --chip:#fff; --star:#ff9500;
  --r-sm:16px; --r-lg:22px; --r-xl:26px;
  --shadow-card:12px 12px 28px rgba(124,108,240,.18),inset 0 3px 0 rgba(255,255,255,.95),inset -3px -3px 8px rgba(124,108,240,.08);
  --shadow-float:0 22px 44px rgba(124,108,240,.24),inset 0 3px 0 rgba(255,255,255,.95);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif;
  --font-display:'Inter',system-ui,sans-serif;
  --gutter:16px;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.icon-btn svg,.wish-btn svg,.cart-add svg,.tab svg,.btn svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- App shell ---------- */
.app{display:flex;flex-direction:column;max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;background:radial-gradient(60% 22% at 85% 8%,#ffe4d6,transparent 70%),radial-gradient(90% 30% at 50% 0,#ffffff,transparent 75%),var(--bg)}
.app>*{flex:none}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.topbar__actions{display:flex;gap:12px}
.icon-btn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:6px 6px 14px rgba(124,108,240,.14),inset 2px 2px 6px #fff;transition:.2s}
.icon-btn:hover{background:#f4f2ff}
.icon-btn svg{width:22px;height:22px}
.menu-btn{justify-items:start;align-content:center;row-gap:5px}
.menu-btn span{width:22px;height:2.5px;border-radius:2px;background:var(--ink)}
.menu-btn span:nth-child(2){width:15px}
.logo{font:800 24px/1 var(--font-display);letter-spacing:-.02em;text-transform:uppercase}
.logo span{color:var(--brand)}
.badge{position:absolute;top:-3px;right:-5px;display:grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;box-shadow:0 0 0 2px var(--bg)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:var(--r-sm);font-size:14px;font-weight:700;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;stroke-width:2.2}
.btn--primary{background:var(--brand);color:#fff;box-shadow:0 10px 20px rgba(124,108,240,.35),inset 0 2px 0 rgba(255,255,255,.35)}
.btn--primary:hover{filter:brightness(1.06)}

/* ---------- Hero banner (clay card) ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:240px;margin:0 var(--gutter);padding:22px 20px;border-radius:var(--r-xl);color:var(--ink);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-float);perspective:1000px;
  background:
    radial-gradient(75% 85% at 102% 108%,rgba(124,108,240,.28) 0 44%,transparent 45%),
    linear-gradient(135deg,#e9e4ff,#ffffff 55%,#fff1e8)}
.hero{animation:heroSway 9s ease-in-out infinite}
@keyframes heroSway{0%,100%{transform:rotateY(-4deg) rotateX(2deg)}50%{transform:rotateY(4deg) rotateX(-2deg)}}
.hero__tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;animation:heroIn .7s ease backwards}
.hero__glare{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(240px circle at var(--gx,80%) var(--gy,20%),rgba(255,255,255,.45),transparent 70%);opacity:0;transition:opacity .3s}
.hero__sheen{position:absolute;inset:-20% 0;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.28) 50%,transparent 58%);transform:translateX(-70%);animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-70%)}85%,100%{transform:translateX(70%)}}
@keyframes heroIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.hero__content{position:relative;z-index:2;max-width:100%}
.hero__title{font:800 clamp(24px,7vw,30px)/1.08 var(--font-display);letter-spacing:-.02em}
.hero__title span{display:block}
.hero__title .is-accent{color:var(--brand)}
.hero__text{margin:10px 0 16px;font-size:13px;line-height:1.45;color:rgba(38,35,61,.72)}
.hero__img{position:relative;z-index:1;display:block;height:170px;width:auto;max-width:88%;margin:0 auto 14px;object-fit:contain;background:#fff;border-radius:24px;padding:10px;transform:rotate(-6deg);box-shadow:12px 12px 28px rgba(124,108,240,.22),inset 0 2px 0 #fff;animation:floaty 4.5s ease-in-out infinite;will-change:transform}
@keyframes floaty{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-9px)}}
.hero__tag{display:inline-block;margin:0 0 14px;padding:6px 10px;border-radius:999px;background:#fff;box-shadow:0 6px 14px rgba(124,108,240,.16);font-size:10px;font-weight:700;line-height:1.4;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* ---------- Carousel dots ---------- */
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 16px}
.dots__dot{width:7px;height:7px;border-radius:50%;background:#d9d4f5;transition:background .25s,transform .25s}
.dots__dot.is-active{background:var(--brand);transform:scale(1.35);box-shadow:0 4px 10px rgba(124,108,240,.45)}

/* ---------- Categories + filter chips ---------- */
.categories,.chips{display:flex;overflow-x:auto;scrollbar-width:none}
.categories::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.categories{justify-content:space-between;gap:8px;padding:0 var(--gutter);margin-bottom:18px;animation:fadeUp .6s .15s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.category{display:grid;flex:1 0 58px;justify-items:center;align-content:start;gap:7px;font-size:12px;font-weight:500;text-align:center}
.category__icon{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:8px 8px 16px rgba(124,108,240,.16),inset 3px 3px 6px #fff,inset -3px -3px 6px rgba(124,108,240,.10);transition:.25s;font-size:20px;font-weight:800}
.category:nth-child(1) .category__icon{background:#e9e4ff}
.category:nth-child(2) .category__icon{background:#dbeafe}
.category:nth-child(3) .category__icon{background:#ffe4d6}
.category:nth-child(4) .category__icon{background:#d9f5e3}
.category:nth-child(5) .category__icon{background:#ffe3ec}
.category:nth-child(6) .category__icon{background:#fff3c4}
.category:nth-child(7) .category__icon{background:#e0f2fe}
.category:nth-child(8) .category__icon{background:#f3e8ff}
.category__icon svg,.category__icon img{width:30px;height:30px;object-fit:contain}
.category:active .category__icon{transform:scale(.94)}
.category.is-active .category__icon{border-radius:20px;background:var(--brand);color:#fff;box-shadow:0 10px 20px rgba(124,108,240,.35)}

.chips{gap:10px;padding:2px var(--gutter) 14px}
.chip{flex:none;padding:10px 18px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;box-shadow:6px 6px 12px rgba(124,108,240,.10),inset 2px 2px 4px #fff;transition:.2s}
.chip:hover{color:var(--ink)}
.chip.is-active{background:var(--brand);color:#fff;font-weight:700;box-shadow:0 8px 16px rgba(124,108,240,.3)}

/* ---------- Product grid (clay cards) ---------- */
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 var(--gutter) 24px}
.product-card{position:relative;display:flex;flex-direction:column;padding:12px;border-radius:var(--r-lg);background:var(--surface);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-card);content-visibility:auto;contain-intrinsic-size:280px}
.product-card__media{display:grid;place-items:center;aspect-ratio:1.28;margin:22px 0 6px;background:#f1edff;border-radius:16px;padding:8px}
.product-card:nth-child(4n+2) .product-card__media{background:#e8f1ff}
.product-card:nth-child(4n+3) .product-card__media{background:#fff0e6}
.product-card:nth-child(4n+4) .product-card__media{background:#e6f7ee}
.product-card__media img{width:100%;height:100%;object-fit:contain}
.product-card__title{font-size:14px;font-weight:700;line-height:1.25}
.product-card__sub{margin-top:2px;font-size:11.5px;color:var(--muted)}
.product-card__row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.rating{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;color:var(--muted)}
.rating__stars{color:var(--star);font-size:12px;letter-spacing:1px}

.cart-add{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:var(--r-sm);background:var(--brand);color:#fff;box-shadow:0 8px 16px rgba(124,108,240,.3),inset 0 2px 0 rgba(255,255,255,.3);transition:.15s}
.cart-add:hover{background:var(--brand-700)}
.cart-add:active{transform:scale(.92)}
.cart-add svg{width:20px;height:20px}

.tag{position:absolute;top:12px;left:12px;z-index:1;padding:5px 9px;border-radius:9px;font-size:11px;font-weight:700;line-height:1.1}
.tag--best{background:var(--brand-50);color:var(--brand-700)}
.tag--new{background:var(--ink);color:#fff}
.tag--sale{background:var(--brand);color:#fff}

.wish-btn{position:absolute;top:10px;right:10px;z-index:1;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;transition:color .2s,transform .15s}
.wish-btn svg{width:22px;height:22px}
.wish-btn:active{transform:scale(.85)}
.wish-btn.is-active{color:var(--brand)}
.wish-btn.is-active svg{fill:currentColor}

/* ---------- Settings panel (top ⚙️) ---------- */
.settings-panel{margin:0 var(--gutter) 14px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-card)}
.settings-panel .btn{display:flex;width:100%;justify-content:center;margin-bottom:8px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px 2px;font-size:14px;font-weight:600}
.switch-row input{width:22px;height:22px;accent-color:var(--brand)}
.settings-ver{margin-top:10px;text-align:center;font-size:12px;opacity:.9}
#settingsBtn{font-size:20px}
body.lite .hero,body.lite .hero__img,body.lite .hero__sheen{animation:none!important}
body.lite .hero__glare{display:none}
body.lite .hero__img{transform:rotate(-6deg)}
body.lite .hero{box-shadow:0 6px 16px rgba(124,108,240,.15)}
body.lite .product-card{box-shadow:0 3px 8px rgba(124,108,240,.10)}

/* ---------- Small phones + reduced motion ---------- */
@media (max-width:360px){
  .products{gap:10px}
  .product-card{padding:10px}
  .price{font-size:17px}
  .cart-add{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ---------- Clay press + 3D vibe ---------- */
.btn:active,.chip:active{transform:scale(.94)}
.product-card{transition:transform .2s,box-shadow .2s}
.product-card:active{transform:scale(.97);box-shadow:inset 5px 5px 14px rgba(124,108,240,.14)}
.category:active .category__icon{transform:scale(.90)}

/* ---------- Live search bar ---------- */
.livebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 var(--gutter) 12px}
.livebtn{padding:11px 18px;border-radius:999px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;box-shadow:6px 6px 14px rgba(124,108,240,.35),inset 0 2px 0 rgba(255,255,255,.35)}
.livebtn:active{transform:scale(.95)}
.livebtn:disabled{opacity:.6}
.liveoff{padding:10px 14px;border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:600;box-shadow:var(--shadow-card)}
.livenote{font-size:12.5px;color:var(--muted)}
.tag--live{background:var(--brand);color:#fff}
.media-letter{width:100%;padding:30px 0;font-size:42px;font-weight:800;color:var(--brand-700);background:var(--brand-50);border-radius:18px;text-align:center}
.mgr{margin-top:12px}
.mgr input{width:100%;border:2px solid #d9d4f5;border-radius:12px;padding:10px 12px;font-size:15px;margin:8px 0}
.mgr__out{font-size:14px;line-height:1.7;margin-top:8px}
.mgr__out table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.mgr__out th{background:#efeefb;text-align:left;padding:6px}
.mgr__out td{padding:6px;border-bottom:1px solid #eee}

/* ---------- Catalog additions ---------- */
.searchbar{padding:2px var(--gutter) 12px}
.searchbar input{width:100%;padding:13px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.9);background:var(--surface);font:inherit;font-size:15px;outline:none;color:var(--ink);box-shadow:inset 4px 4px 10px rgba(124,108,240,.10),inset -4px -4px 10px #fff,6px 6px 14px rgba(124,108,240,.10)}
.searchbar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.statusline{padding:0 var(--gutter) 12px;color:var(--muted);font-size:12.5px}
.more-wrap{display:flex;justify-content:center;padding:0 var(--gutter) 20px}
.more-wrap .chip{background:var(--brand);color:#fff}
.btn--ghost{background:var(--surface);color:var(--ink);box-shadow:6px 6px 14px rgba(124,108,240,.14),inset 2px 2px 4px #fff}
.hero__btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero__btns .btn--ghost{padding:11px 6px;font-size:13px;justify-content:center;width:100%}
.mgr .btn{width:100%;justify-content:center}
.category__label{line-height:1.2}

.searchbar{display:flex;gap:8px;align-items:center}
.searchbar input{flex:1;width:auto}
.mini-btn{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--surface);font-size:20px;box-shadow:6px 6px 14px rgba(124,108,240,.14),inset 2px 2px 6px #fff}
.mini-btn:active{transform:scale(.94)}
.note{margin-top:10px}
.note input{width:100%;padding:11px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.9);background:var(--surface);font:inherit;font-size:14px;outline:none;color:var(--ink);box-shadow:inset 4px 4px 10px rgba(124,108,240,.10)}
.note__saved{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.scan-modal{position:fixed;inset:0;z-index:50;display:none;place-content:center;gap:12px;padding:20px;background:rgba(20,18,40,.82);color:#fff;text-align:center}
.scan-modal.open{display:grid}
.scan-modal video{width:min(92vw,430px);border-radius:20px;background:#000}
.scan-modal .btn{justify-content:center}
#scanOut{font-size:14px;line-height:1.6}
body.dark{--bg:#17142e;--surface:#241f45;--ink:#efeaff;--muted:#a49ed0}
body.dark .app{background:radial-gradient(60% 22% at 85% 8%,#3a2a5e,transparent 70%),radial-gradient(90% 30% at 50% 0,#2a2450,transparent 75%),var(--bg)}
body.dark .hero{background:radial-gradient(75% 85% at 102% 108%,rgba(124,108,240,.35) 0 44%,transparent 45%),linear-gradient(135deg,#2c2560,#241f45 55%,#3a2a4a)}
body.dark .product-card__media,body.dark .product-card:nth-child(4n+2) .product-card__media,body.dark .product-card:nth-child(4n+3) .product-card__media,body.dark .product-card:nth-child(4n+4) .product-card__media{background:#2e2760}
body.dark .mgr__out th{background:#2e2760}
body.dark .searchbar input,body.dark .note input,body.dark .mgr input{background:var(--surface);color:var(--ink)}
.loader{position:fixed;inset:0;z-index:999;background:#000;overflow:hidden;transition:opacity .6s;animation:loaderHide .6s ease 12s forwards}
.loader.hide{opacity:0;pointer-events:none}
.loader__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}

@keyframes loaderHide{to{opacity:0;visibility:hidden}}
</style>
<style id="clay-v222">
/* ---------- v2.22 Deep 3D clay (puffy, glossy) ---------- */
:root{--bg:#e6e3f2;--surface:#f4f2fc;--ink:#1f1c38;--muted:#857fa3;--brand:#8c7af2;--brand-50:#e4defd;--brand-700:#6652e0;--r-sm:22px;--r-lg:32px;--r-xl:40px}
body{--hi:#fff;--lo:rgba(120,104,214,.22);--drop:rgba(96,80,196,.30);--glow:rgba(255,255,255,.95);--gloss:rgba(255,255,255,.7);
  --clay:16px 20px 36px var(--drop),-10px -10px 24px var(--glow),inset 7px 7px 14px var(--hi),inset -9px -11px 20px var(--lo);
  --clay-sm:8px 10px 20px var(--drop),-6px -6px 14px var(--glow),inset 4px 4px 9px var(--hi),inset -5px -6px 11px var(--lo);
  --clay-in:inset 7px 7px 15px rgba(96,80,196,.22),inset -7px -7px 15px rgba(255,255,255,.95);
  --clay-brand:0 12px 22px rgba(102,82,224,.42),inset 5px 5px 10px rgba(255,255,255,.55),inset -6px -8px 14px rgba(60,40,180,.42);
  --pop:linear-gradient(160deg,var(--gloss),transparent 46%),var(--surface);
  --grad:radial-gradient(circle at 28% 20%,rgba(255,255,255,.6),transparent 48%),linear-gradient(145deg,#b3a6ff,#7561ec);
  --shadow-card:var(--clay);--shadow-float:var(--clay)}
body.dark{--hi:rgba(255,255,255,.1);--lo:rgba(0,0,0,.42);--drop:rgba(0,0,0,.6);--glow:rgba(255,255,255,.05);--gloss:rgba(255,255,255,.07);--clay-in:inset 7px 7px 15px rgba(0,0,0,.5),inset -6px -6px 14px rgba(255,255,255,.05)}
.app{background:radial-gradient(70% 26% at 50% -2%,#fff,transparent 72%),radial-gradient(55% 22% at 94% 9%,#ffe3d8,transparent 70%),radial-gradient(50% 26% at 2% 58%,#d6e4ff,transparent 70%),var(--bg)}
.logo{font-size:27px;text-shadow:0 2px 0 var(--glow),0 8px 12px var(--drop)}
.icon-btn{width:46px;height:46px}
.icon-btn,.mini-btn,.chip,.btn--ghost,.liveoff{background:var(--pop);box-shadow:var(--clay-sm)}
.icon-btn:hover{background:var(--pop)}
.icon-btn:active,.mini-btn:active,.chip:active,.btn--ghost:active{box-shadow:var(--clay-in);transform:scale(.94)}
.hero{border:0;border-radius:var(--r-xl);color:#fff;background:radial-gradient(75% 60% at 16% 6%,rgba(255,255,255,.6),transparent 62%),radial-gradient(70% 80% at 104% 110%,rgba(52,32,176,.45) 0 42%,transparent 43%),linear-gradient(150deg,#c2b7ff,#8f7cf4 52%,#6c57e6);box-shadow:0 24px 40px rgba(102,82,224,.45),inset 9px 9px 18px rgba(255,255,255,.6),inset -11px -15px 26px rgba(52,32,176,.4)}
.hero__title,.hero__text{color:#fff;text-shadow:0 2px 8px rgba(52,32,176,.4)}
.hero__text{color:rgba(255,255,255,.93)}
.hero__title .is-accent{color:#fff3bf}
.hero__tag{color:var(--brand-700);background:rgba(255,255,255,.92)}
.hero__img{border-radius:34px;box-shadow:var(--clay)}
.dots__dot{background:#cfc8f3;box-shadow:inset 1px 1px 2px rgba(0,0,0,.12),1px 1px 2px #fff}
.dots__dot.is-active{background:var(--grad);box-shadow:0 4px 8px rgba(102,82,224,.5)}
.category{font-weight:600}
.category__icon{width:68px;height:68px;box-shadow:var(--clay-sm)}
.category:nth-child(n) .category__icon{background-image:radial-gradient(circle at 30% 20%,rgba(255,255,255,.95),rgba(255,255,255,0) 48%)}
.category.is-active .category__icon{background:var(--grad);color:#fff;border-radius:26px;box-shadow:var(--clay-brand)}
.chip{padding:11px 20px;font-weight:600}
.chip.is-active,.more-wrap .chip,.btn--primary,.livebtn,.cart-add{background:var(--grad);color:#fff;box-shadow:var(--clay-brand)}
.cart-add{width:44px;height:44px;border-radius:17px}

function renderHero(p, fromUser){
  if (!p) return;

  if (typeof mgrClear === "function") mgrClear();
  heroImgIdx = 0;
  heroTitle.innerHTML = nameSpans(p.name);
  var bits = [p.category, p.leaf];
  if (p.size) bits.push(p.size);
  else if (p.capacity) bits.push(p.capacity);
  if (p.variant) bits.push(p.variant);
  heroText.textContent = bits.join("  •  ");
  heroTag.textContent = "CODE " + p.code;
  copyBtn.textContent = "CODE COPY";
  var src = heroImgSrc(p, 0);
  heroImg.style.display = src ? "block" : "none"; heroImg.style.visibility = "visible";
  heroImg.src = src;
  heroImg.onerror = function(){
    var im = imgsOf(p);
    if (heroImg.src !== im.remote[0] && im.remote[0]) { heroImg.src = im.remote[0]; return; }
    heroImg.style.display = "none";
  };
  renderDots();
  refreshHeroTools();
  if (p.live && !heroImgSrc(p, 0) && !p._enrichTried) enrichLive(p);
}

async function mgrFetch(){

    if (!res.ok) throw new Error("HTTP " + res.status);

    if ((qEl.value || "").trim() !== q) return;
    liveProducts = (data.products || []).map(function(r){
      var cap = (r.name.match(/(\d+(?:\.\d+)?)\s?L\b/) || [])[1];

async function barcodeLookup(code){
  var out = document.getElementById("mgrOut");
  if (!mgrPin) { pendingBarcode = code; out.textContent = "Barcode found (" + code + "). Enter the manager code under Tap to Details, then press View to see the info."; document.getElementById("mgrPinWrap").hidden = false; document.getElementById("hero").scrollIntoView(); return; }
  out.textContent = "Matching barcode…";
  document.getElementById("hero").scrollIntoView();
  try {
    var res = await fetch(WORKER_BASE + "/barcode?code=" + encodeURIComponent(code) + "&pin=" + encodeURIComponent(mgrPin));
    var d = await res.json();
    if (res.status === 403) { mgrPin = ""; out.textContent = "Incorrect code. Please enter it again."; return; }
    if (!d.found) { out.textContent = "This barcode isn’t mapped yet. All barcodes will be added once the ASCP export is imported."; return; }
    var c = d.ccode ? ("<b>Carton code:</b> " + esc(d.ccode) + "<br><b>Carton:</b> " + esc(d.cname)) : "<b>No carton assigned</b>";
    var fg = "";
    if (d.fg && d.fg.length) {
      var rows = d.fg.map(function(l){ return "<tr><td>" + esc(l[0]) + "</td><td>" + esc(l[1]) + "</td><td>" + esc(l[2]) + "</td><td>" + esc(l[3]) + "</td><td><b>" + esc(l[4]) + "</b></td></tr>"; }).join("");
      fg = "<div style=\"margin-top:8px\"><b>FG Mapping (ASCP)</b><table><tr><th>Type</th><th>Code</th><th>Name</th><th>Unit</th><th>Qty</th></tr>" + rows + "</table></div>";
    }
    out.innerHTML = "<div><b>Item:</b> " + esc(d.name) + " (Code " + esc(d.code) + ")<br>" + c + fg + "</div>";
  } catch (e) { out.textContent = "Couldn’t load. Check your connection and try again."; }
}
document.getElementById("scanBtn").addEventListener("click", async function(){
  var modal = document.getElementById("scanModal");
  var video = document.getElementById("scanVideo");
  var sout = document.getElementById("scanOut");
  scanActive = true;
  modal.classList.add("open");
  if (!("BarcodeDetector" in window)) { sout.textContent = "Scanning isn’t supported in this browser — open it in Chrome."; return; }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) { sout.textContent = "Allow camera access, then try again."; return; }
  video.srcObject = scanStream; video.muted = true; video.play().catch(function(){});
  var detector = null;
  try { detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "code_128", "upc_a", "upc_e"] }); }
  catch (e) { sout.textContent = "Scanning isn’t supported in this browser — open it in Chrome."; stopScan(); return; }
  sout.textContent = "Point the camera at a barcode…";
  scanStopTimer = setTimeout(function(){ stopScan(); }, 60000);
  (async function loop(){
    if (!scanActive || !scanStream) return;
    try {
      var codes = await detector.detect(video);
      if (codes && codes.length) { var v = codes[0].rawValue || ""; stopScan(); if (v) barcodeLookup(v); return; }
    } catch (e) {}
    scanRaf = requestAnimationFrame(function(){ loop(); });
  })();
});

function roundRectPath(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a+r, b); x.arcTo(a+w, b, a+w, b+h, r); x.arcTo(a+w, b+h, a, b+h, r); x.arcTo(a, b+h, a, b, r); x.arcTo(a, b, a+w, b, r); x.closePath(); }
function drawWrapped(x, text, cx, y, maxW, lh){
  var words = String(text || "").split(/\s+/); var line = ""; var lines = 0;
  x.textAlign = "center";
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + " " + words[i] : words[i];
    if (x.measureText(test).width > maxW && line) { x.fillText(line, cx, y); y += lh; lines++; if (lines >= 4) { x.fillText("…", cx, y); return y + lh; } line = words[i]; }
    else line = test;
  }
  if (line) { x.fillText(line, cx, y); y += lh; }
  return y;
}

(function(){
  var hero = document.getElementById("hero");
  var sx = null;
  hero.addEventListener("pointerdown", function(e){ sx = e.target.closest("button,a,input,table,.mgr__out,.note") ? null : e.clientX; });
  hero.addEventListener("pointercancel", function(){ sx = null; });
  hero.addEventListener("pointerup", function(e){
    if (sx == null) return;
    var dx = e.clientX - sx;
    sx = null;
    if (Math.abs(dx) < 50 || !selected) return;
    var list = filtered();
    var idx = -1;
    list.forEach(function(p, i){ if (String(p.id) === String(selected.id)) idx = i; });
    if (idx < 0 || !list.length) return;
    var next = list[(idx + (dx < 0 ? 1 : -1) + list.length) % list.length];
    renderHero(next, true);
  });
})();

/* products.json load: 60 second timeout, falls back to the offline copy. */
async function load(){
  allProducts = FALLBACK_PRODUCTS.slice();
  renderHero(allProducts[0] || null);
  renderAll();
  statusEl.textContent = "Loading the latest list, please wait…";
  try {
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 60000);
    var res = await fetch("products.json", { signal: ctrl.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = await res.json();
    if (data && Array.isArray(data.products) && data.products.length){
      var keepId = selected ? selected.id : null;
      allProducts = data.products;
      var keep = null;
      allProducts.forEach(function(p){ if (String(p.id) === String(keepId)) keep = p; });
      renderHero(keep || allProducts[0] || null);
      renderAll();
      statusEl.textContent = "Loaded " + allProducts.length + " products.";
    } else {
      statusEl.textContent = "Showing the offline copy — reload the page when online to see new products.";
    }
  } catch (e) {
    statusEl.textContent = "Showing the offline copy — reload the page when online to see new products.";
  }
}
load();

<script id="clay-tilt">
(function(){
  var cur=null,raf=0;
  function off(c){if(!c)return;c.classList.remove('is-tilt');c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}
  function on(e){
    var t=e.target,c=t&&t.closest?t.closest('.product-card'):null;
    if(cur&&cur!==c)off(cur);
    cur=c;
    if(!c||document.body.classList.contains('lite'))return;
    var k=e.pointerType==='touch'?10:18,r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(function(){
      c.classList.add('is-tilt');
      c.style.setProperty('--ry',((px-.5)*k).toFixed(1)+'deg');
      c.style.setProperty('--rx',((.5-py)*k).toFixed(1)+'deg');
      c.style.setProperty('--mx',(px*100).toFixed(0)+'%');
      c.style.setProperty('--my',(py*100).toFixed(0)+'%');
    });
  }
  function end(){cancelAnimationFrame(raf);off(cur);cur=null}
  document.addEventListener('pointermove',on,{passive:true});
  document.addEventListener('pointerdown',on,{passive:true});
  document.addEventListener('pointerup',end,{passive:true});
  document.addEventListener('pointercancel',end,{passive:true});
  document.documentElement.addEventListener('mouseleave',end);
  var nav=document.getElementById('cnav');
  nav.addEventListener('click',function(e){
    var b=e.target.closest('button[data-t]');if(!b)return;
    var t=document.getElementById(b.getAttribute('data-t'));if(t)t.click();
    [].forEach.call(nav.children,function(x){x.classList.toggle('on',x===b)});
  });
})();
