# RFL Catalog — auto update (GitHub Pages, kono server lagbe na)
# - Proti Sombar sokal 9ta (Dhaka time = Robbar rat 9ta UTC) auto cholbe
# - Actions tab theke "Run workflow" chapleo ekhoni cholbe
# - Site na pele ba notun kichu na pele: purono products.json-i thakbe,
#   khali file kokhono commit hobe na.
name: Update RFL Catalog

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Chobi choto korar jonno sharp — na bosleo script asol chobi rakhbe.
      - name: Install image tool (best effort)
        run: npm install sharp --no-save || echo "sharp boseni, asol chobi use hobe"
        continue-on-error: true
      - name: Fetch new products from RFL site
        run: node scripts/scrape-rfl.mjs
      - name: Commit if products.json or images changed
        run: |
          git config user.name "rfl-catalog-bot"
          git config user.email "rfl-catalog-bot@users.noreply.github.com"
          git add products.json images || true
          git diff --cached --quiet && echo "Kono poriborton nei" || (git commit -m "Catalog update: RFL site theke notun product" && git push)
